    <polyline points="500,420 660,420 660,520 820,520 820,440 1000,440" stroke="#D97706" stroke-width="2.5" fill="none" stroke-dasharray="700" stroke-dashoffset="700" style="animation:draw3 7s ease-in-out 2.8s infinite"/>
    <g style="animation:fdot 7s ease-in-out 2.8s infinite"><circle cx="660" cy="420" r="5" fill="#D97706"/><circle cx="820" cy="520" r="5" fill="#D97706"/></g>
