      <line x1="0" y1="500" x2="1200" y2="500"/><line x1="0" y1="600" x2="1200" y2="600"/>
      <line x1="200" y1="0" x2="200" y2="700"/><line x1="400" y1="0" x2="400" y2="700"/>
      <line x1="600" y1="0" x2="600" y2="700"/><line x1="800" y1="0" x2="800" y2="700"/>
      <line x1="1000" y1="0" x2="1000" y2="700"/>
    </g>
    <polyline points="180,80 360,80 360,180 540,180 540,100 720,100" stroke="#D97706" stroke-width="2.5" fill="none" stroke-dasharray="600" stroke-dashoffset="600" style="animation:draw1 5s ease-in-out 0s infinite"/>
    <g style="animation:fdot 5s ease-in-out 0s infinite"><circle cx="360" cy="80" r="5" fill="#D97706"/><circle cx="360" cy="180" r="5" fill="#D97706"/><circle cx="540" cy="180" r="5" fill="#D97706"/><circle cx="540" cy="100" r="5" fill="#D97706"/></g>
    <polyline points="820,200 980,200 980,300 1150,300 1150,220 1180,220" stroke="#D97706" stroke-width="2.5" fill="none" stroke-dasharray="500" stroke-dashoffset="500" style="animation:draw2 6s ease-in-out 1.2s infinite"/>
