<svg class="hero-circuit" style="contain:strict;" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><style>
      @keyframes draw1{0%{stroke-dashoffset:600}40%{stroke-dashoffset:0}70%{stroke-dashoffset:0}100%{stroke-dashoffset:600}}
      @keyframes draw2{0%{stroke-dashoffset:500}40%{stroke-dashoffset:0}70%{stroke-dashoffset:0}100%{stroke-dashoffset:500}}
      @keyframes draw3{0%{stroke-dashoffset:700}40%{stroke-dashoffset:0}70%{stroke-dashoffset:0}100%{stroke-dashoffset:700}}
      @keyframes draw4{0%{stroke-dashoffset:550}40%{stroke-dashoffset:0}70%{stroke-dashoffset:0}100%{stroke-dashoffset:550}}
      @keyframes draw5{0%{stroke-dashoffset:620}40%{stroke-dashoffset:0}70%{stroke-dashoffset:0}100%{stroke-dashoffset:620}}
      @keyframes draw6{0%{stroke-dashoffset:530}40%{stroke-dashoffset:0}70%{stroke-dashoffset:0}100%{stroke-dashoffset:530}}
      @keyframes fdot{0%,20%{opacity:0}50%,70%{opacity:1}90%,100%{opacity:0}}
    </style></defs>
    <g stroke="#1A3060" stroke-width="0.8" opacity="0.18">
