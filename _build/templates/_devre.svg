    <polyline points="600,280 740,280 740,360 880,360 880,280 1060,280" stroke="#1A3060" stroke-width="2.5" fill="none" stroke-dasharray="620" stroke-dashoffset="620" style="animation:draw5 6.5s ease-in-out 2.1s infinite"/>
